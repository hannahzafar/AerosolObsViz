[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[project]
name = "aerosolobsviz"
version = "0.1.0"
description = "Download aerosol observational data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "eodag>=4.4.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "requests>=2.34.2",
    "xarray>=2026.4.0",
]
